name: Check Spotx for the latest Spotify
run-name: Check SpotX for Spotify ${{ inputs.version || 'latest' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Spotify version like 1.2.95 or 1.2.95.453, empty means latest
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Prepare checks
      id: prepare
      shell: powershell
      env:
        SPOTIFY_VERSION: ${{ inputs.version }}
      run: |
        $spotifyVersion = ([string]$env:SPOTIFY_VERSION).Trim()

        if ([string]::IsNullOrWhiteSpace($spotifyVersion)) {
          $jsonUrl = "https://raw.githubusercontent.com/LoaderSpot/table/refs/heads/main/table/versions.json"
          $resp = Invoke-RestMethod -Uri $jsonUrl

          # Use fullversion for the installer name
          $latestEntry = $resp.PSObject.Properties | Select-Object -First 1
          if (-not $latestEntry) {
            throw "No Spotify versions found in $jsonUrl"
          }

          $spotifyVersion = [string]$latestEntry.Value.fullversion
          if ([string]::IsNullOrWhiteSpace($spotifyVersion) -or $spotifyVersion -notmatch '^\d+\.\d+\.\d+\.\d+\.g[0-9a-f]{8}$') {
            throw "Invalid Spotify fullversion for $($latestEntry.Name)"
          }
        }
        elseif ($spotifyVersion -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
          throw "Invalid Spotify version: $spotifyVersion"
        }

        Write-Host "Selected Spotify version: $spotifyVersion"
        
        # Incoming parameters
        $parameters = @{
          Verbose = $true
          no_pause = $true
          new_theme = $true
          version = $spotifyVersion
          confirm_spoti_recomended_over = $true
          cache_limit = 1000
          block_update_on = $true
          lyrics_stat = "spotify"
          urlform_goofy = "https://docs.google.com/forms/formResponse"
          idbox_goofy = "9999999"
          podcasts_off = $true
          adsections_off = $true
          lyrics_block = $true
        }
        
        $spotxUrl = "https://raw.githubusercontent.com/SpotX-Official/SpotX/refs/heads/main/run.ps1"
        Invoke-WebRequest -UseBasicParsing -Uri $spotxUrl -OutFile "$env:RUNNER_TEMP\spotx.ps1"
        $parameters | Export-Clixml -LiteralPath "$env:RUNNER_TEMP\spotx-parameters.xml"

    - name: Run SpotX (x64)
      shell: powershell
      run: |
        $parameters = Import-Clixml -LiteralPath "$env:RUNNER_TEMP\spotx-parameters.xml"
        $spotxScript = [scriptblock]::Create((Get-Content -LiteralPath "$env:RUNNER_TEMP\spotx.ps1" -Raw -Encoding UTF8))
        & $spotxScript @parameters

    - name: Run SpotX (ARM64 files)
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      shell: powershell
      run: |
        $parameters = Import-Clixml -LiteralPath "$env:RUNNER_TEMP\spotx-parameters.xml"
        $checkVersion = $parameters.version
        $installedSpotify = Join-Path $env:APPDATA 'Spotify\Spotify.exe'
        if (Test-Path -LiteralPath $installedSpotify) {
          $checkVersion = (Get-Item -LiteralPath $installedSpotify).VersionInfo.FileVersion
        }

        $unpackerUrl = 'https://raw.githubusercontent.com/SpotX-Official/Spotify-EXE-Unpacker/refs/heads/main'
        foreach ($script in @('spotify_exe_unpacker.py', 'scripts/download_spotify_installer.py')) {
          $scriptPath = Join-Path $env:RUNNER_TEMP (Split-Path $script -Leaf)
          Invoke-WebRequest -UseBasicParsing -Uri "$unpackerUrl/$script" -OutFile $scriptPath
        }

        $installerOutput = Join-Path $env:RUNNER_TEMP 'spotify-arm64.txt'
        python "$env:RUNNER_TEMP\download_spotify_installer.py" --version $checkVersion --architecture arm64 --download-dir "$env:RUNNER_TEMP\spotify-arm64-installer" --github-output $installerOutput
        if ($LASTEXITCODE -ne 0) { throw 'ARM64 installer download failed' }

        $installer = @{}
        foreach ($line in Get-Content -LiteralPath $installerOutput) {
          $key, $value = $line -split '=', 2
          $installer[$key] = $value
        }

        $parameters.SpotifyPath = Join-Path $env:RUNNER_TEMP 'Spotify-arm64'
        $parameters.version = $installer.fullversion
        $parameters.defender_exclusions_off = $true
        python "$env:RUNNER_TEMP\spotify_exe_unpacker.py" $installer.installer_path --output $parameters.SpotifyPath
        if ($LASTEXITCODE -ne 0) { throw 'ARM64 installer extraction failed' }

        $spotxScript = [scriptblock]::Create((Get-Content -LiteralPath "$env:RUNNER_TEMP\spotx.ps1" -Raw -Encoding UTF8))
        & $spotxScript @parameters
